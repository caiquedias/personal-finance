<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Esqueci minha senha</h1>
      <p class="subtitle">Informe seu e-mail. Se ele estiver cadastrado, enviaremos um código de 6 dígitos para redefinir a senha.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field">
        <label for="email" class="field-label">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="input"
          [class.error]="showError()"
          placeholder="seu@email.com"
          autocomplete="email"
        />
        @if (showError()) {
          <span class="field-error">{{ getEmailError() }}</span>
        }
      </div>

      <div aria-live="polite">
        @if (apiError()) {
          <div class="auth-error" role="alert">{{ apiError() }}</div>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          Enviando...
        } @else {
          Enviar código
        }
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Voltar para o login</a>
    </div>
  </div>
</div>
